# Default build profile: optimised release (see DERIBO_PLAN.md build modes).
# Never -d:danger for production binaries.
# Dev build: nimble build -d:dev   (no LTO, traces on, fast compile)

--threads:on
--mm:orc
--panics:on

@if dev:
  --opt:speed
  --stackTrace:on
  --lineTrace:on
@else:
  -d:release            # implies --opt:speed (-O3), stackTrace/lineTrace off

  --passC:"-flto=auto"
  --passL:"-flto=auto"

  # GCC 12+ false positive on Nim string ops; with LTO it fires at link time
  --passC:"-Wno-stringop-overflow"
  --passL:"-Wno-stringop-overflow"

  # Benchmark before keeping:
  # --passC:"-funroll-loops"
  # --passC:"-march=x86-64-v3"
@end
